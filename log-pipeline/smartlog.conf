input {
  beats {
    port => 5044
  }
}

filter {
  if [winlog][channel] == "Security" {
    mutate {
      add_field => { "smartlog_source" => "WINDOWS_SECURITY" }
    }
  } else if [winlog][channel] == "System" {
    mutate {
      add_field => { "smartlog_source" => "WINDOWS_SYSTEM" }
    }
  } else if [winlog][channel] == "Application" {
    mutate {
      add_field => { "smartlog_source" => "WINDOWS_APPLICATION" }
    }
  }

  if [event][code] == "4625" {
    mutate {
      add_field => { "smartlog_risk" => "MEDIUM" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://smartlog-elasticsearch:9200"]
    index => "smartlog-windows"
  }

  stdout {
    codec => rubydebug
  }
}